# Wi-Fi: access point (WPA2 / WPA3 personal) in the LAN zone, served by a USB adapter.
# Nexwall addition (not in NethSecurity): see docs/WIFI.md and FORK-CHANGES.md.

# access point stack: hostapd/wpa_supplicant, netifd wireless handler ("wifi config" + hotplug), regulatory data
CONFIG_PACKAGE_wpad-basic-mbedtls=y
CONFIG_PACKAGE_wifi-scripts=y
CONFIG_PACKAGE_iw=y
CONFIG_PACKAGE_iwinfo=y
CONFIG_PACKAGE_rpcd-mod-iwinfo=y
CONFIG_PACKAGE_wireless-regdb=y

# USB host controllers: the generic ARM kernel builds only xHCI in; boards with EHCI/OHCI/DWC2 ports (TV boxes) need these
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb-ohci=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-dwc2=y

# USB Wi-Fi drivers: every one the OpenWrt tree offers, built into the image (an adapter works without internet)
# Realtek (TP-Link Archer T2U/T2U Plus/T2U Nano -> 8821au, T3U/T4U v3 -> 8822bu, T4U v1 -> 8812au, T9UH -> 8814au,
# TL-WN823N/TL-WN725N/TL-WN821N -> rtl8xxxu / rtl8192cu)
CONFIG_PACKAGE_kmod-rtw88-8723du=y
CONFIG_PACKAGE_kmod-rtw88-8812au=y
CONFIG_PACKAGE_kmod-rtw88-8814au=y
CONFIG_PACKAGE_kmod-rtw88-8821au=y
CONFIG_PACKAGE_kmod-rtw88-8821cu=y
CONFIG_PACKAGE_kmod-rtw88-8822bu=y
CONFIG_PACKAGE_kmod-rtw88-8822cu=y
CONFIG_PACKAGE_kmod-rtl8xxxu=y
CONFIG_PACKAGE_kmod-rtl8192cu=y
CONFIG_PACKAGE_kmod-rtl8192du=y
# MediaTek
CONFIG_PACKAGE_kmod-mt76x0u=y
CONFIG_PACKAGE_kmod-mt76x2u=y
CONFIG_PACKAGE_kmod-mt7663u=y
CONFIG_PACKAGE_kmod-mt7921u=y
CONFIG_PACKAGE_kmod-mt7925u=y
# Atheros (TP-Link TL-WN722N v1 -> AR9271) and Ralink
CONFIG_PACKAGE_kmod-ath9k-htc=y
CONFIG_PACKAGE_kmod-ath6kl-usb=y
CONFIG_PACKAGE_kmod-carl9170=y
CONFIG_PACKAGE_kmod-rt2800-usb=y
CONFIG_PACKAGE_kmod-rt73-usb=y

# firmware that rtl8xxxu does not pull in by itself (the other drivers carry theirs as dependencies)
CONFIG_PACKAGE_rtl8188eu-firmware=y
CONFIG_PACKAGE_rtl8188fu-firmware=y
CONFIG_PACKAGE_rtl8192eu-firmware=y
CONFIG_PACKAGE_rtl8723au-firmware=y
CONFIG_PACKAGE_rtl8723bu-firmware=y
