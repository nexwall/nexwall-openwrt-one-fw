# Generic ARMv7 (32-bit) target, UEFI boot, for QEMU/KVM: baseline of the 32-bit line (TV boxes, RK322x). The arm
# (ARMv7) build of the license core and the web protection service are pinned in their recipes.
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv7=y
CONFIG_TARGET_armsr_armv7_DEVICE_generic=y
CONFIG_TARGET_BOARD="armsr"
CONFIG_TARGET_SUBTARGET="armv7"
CONFIG_TARGET_PROFILE="DEVICE_generic"
CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a15_neon-vfpv4"

# Vendor binaries not built for 32-bit ARM yet (the DPI and IPS plugins): explicit community build for these two.
CONFIG_NEXWALL_NETIFY_PLUGINS_VENDOR=n
CONFIG_NEXWALL_SNORT_PLUGINS_VENDOR=n

# Lite profile: no antivirus engines (ClamAV needs about 1 GiB of RAM and the Rust host toolchain). The DPI engine
# stays: web protection tier 1 and tier 2 depend on it.
CONFIG_NEXWALL_WEBPROTECTION_AV=n
CONFIG_PACKAGE_clamav=n
CONFIG_PACKAGE_freshclam=n
CONFIG_PACKAGE_yara=n
