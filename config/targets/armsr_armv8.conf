# Generic ARM64 (armv8) target: UEFI boot like x86, for QEMU/KVM and SystemReady ARM64 machines
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y
CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
CONFIG_TARGET_BOARD="armsr"
CONFIG_TARGET_SUBTARGET="armv8"
CONFIG_TARGET_PROFILE="DEVICE_generic"
CONFIG_TARGET_ARCH_PACKAGES="aarch64_generic"

# Vendor binaries not built for ARM yet (the license core and the web protection service are). Explicit community
# build for these two until they are: the recipes refuse to build when the option is on and no binary is pinned.
CONFIG_NEXWALL_NETIFY_PLUGINS_VENDOR=n
CONFIG_NEXWALL_SNORT_PLUGINS_VENDOR=n
