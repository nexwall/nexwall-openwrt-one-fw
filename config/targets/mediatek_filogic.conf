# MediaTek Filogic (MT7981, MT7986, MT7987, MT7988; aarch64). One package set (aarch64_cortex-a53) for every board; the
# board is chosen by PROFILE (config/profiles/). Lite profile (no antivirus engines) until the RAM of each board is measured.
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_BOARD="mediatek"
CONFIG_TARGET_SUBTARGET="filogic"
CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"

# The license core and the web protection service are pinned for aarch64; the DPI and IPS plugin feeds are not built
# for ARM yet: explicit community build for these two.
CONFIG_NEXWALL_NETIFY_PLUGINS_VENDOR=n
CONFIG_NEXWALL_SNORT_PLUGINS_VENDOR=n

# Lite profile: no antivirus engines (ClamAV needs about 1 GiB of RAM, the whole board). The DPI engine stays.
CONFIG_NEXWALL_WEBPROTECTION_AV=n
CONFIG_PACKAGE_clamav=n
CONFIG_PACKAGE_freshclam=n
CONFIG_PACKAGE_yara=n
